version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aidental_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aidental_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidental_backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/aidentalcare
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - aidental_net
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: aidental_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - aidental_net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  aidental_net:
    driver: bridge
